name: 날씨 수집

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (UTC 기준이지만 매시간이라 상관없음)
  workflow_dispatch:        # Actions 탭에서 직접 실행 버튼

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 기상청 실황 받기
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: python fetch_weather.py
      - name: 결과 저장
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json history.json
          git diff --cached --quiet || git commit -m "날씨 갱신"
          git push
